
<script type="module">
import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

let transcriber = null;

async function getTranscriber(message) {
  if (!transcriber) {
    message.textContent = "⏳ Chargement du modèle Whisper...";

    transcriber = await pipeline(
      "automatic-speech-recognition",
      "Xenova/whisper-tiny"
    );
  }
  return transcriber;
}

// Langues disponibles pour la lecture vocale
const voiceLanguages = {
  ht: "ht-HT",
  fr: "fr-FR",
  en: "en-US",
  es: "es-ES",
  pt: "pt-PT",
  de: "de-DE",
  it: "it-IT",
  ar: "ar-SA",
  zh: "zh-CN"
};

// Convertir audio en mono 16 kHz et le découper
async function prepareAudio(file) {
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) {
    throw new Error("AudioContext non disponible sur cet appareil.");
  }

  const context = new AudioContextClass();

  try {
    const buffer = await file.arrayBuffer();
    const decoded = await context.decodeAudioData(buffer);

    const targetRate = 16000;
    const sourceRate = decoded.sampleRate;
    const sourceLength = decoded.length;

    const mono = new Float32Array(sourceLength);

    for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
      const channelData = decoded.getChannelData(channel);

      for (let i = 0; i < sourceLength; i++) {
        mono[i] += channelData[i] / decoded.numberOfChannels;
      }
    }

    const outputLength = Math.floor(
      sourceLength * targetRate / sourceRate
    );

    const resampled = new Float32Array(outputLength);

    for (let i = 0; i < outputLength; i++) {
      const position = i * sourceRate / targetRate;
      const index = Math.floor(position);
      const fraction = position - index;

      const first = mono[index] || 0;
      const second = mono[index + 1] || first;

      resampled[i] =
        first * (1 - fraction) + second * fraction;
    }

    return resampled;

  } finally {
    await context.close();
  }
}

// Analyser l'audio par morceaux de 30 secondes
async function transcribeInChunks(file, message) {
  const model = await getTranscriber(message);

  message.textContent = "🎧 Préparation du fichier audio...";

  const audio = await prepareAudio(file);

  const sampleRate = 16000;
  const chunkSeconds = 30;
  const chunkSize = sampleRate * chunkSeconds;

  const totalChunks = Math.ceil(audio.length / chunkSize);
  const transcripts = [];

  for (let i = 0; i < totalChunks; i++) {
    const start = i * chunkSize;
    const end = Math.min(start + chunkSize, audio.length);

    const chunk = audio.slice(start, end);

    const progress = Math.round(
      ((i + 1) / totalChunks) * 100
    );

    message.textContent =
      `🎧 Analyse audio : ${progress}% (${i + 1}/${totalChunks})`;

    const result = await model(chunk, {
      sampling_rate: sampleRate
    });

    if (result.text) {
      transcripts.push(result.text.trim());
    }
  }

  return transcripts.join(" ");
}

// Lire la traduction
function speakTranslation(text, language, message) {
  if (!("speechSynthesis" in window)) {
    message.textContent =
      "⚠️ Lecture vocale non disponible.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = voiceLanguages[language] || "fr-FR";
  utterance.rate = 0.95;
  utterance.pitch = 1;

  const voices = window.speechSynthesis.getVoices();

  const selectedVoice = voices.find(voice =>
    voice.lang.toLowerCase().startsWith(
      utterance.lang.toLowerCase().split("-")[0]
    )
  );

  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }

  utterance.onstart = () => {
    message.textContent = "🔊 Lecture de la traduction...";
    document.getElementById("stopButton").style.display = "block";
  };

  utterance.onend = () => {
    message.textContent = "✅ Lecture terminée.";
    document.getElementById("stopButton").style.display = "none";
  };

  utterance.onerror = () => {
    message.textContent = "⚠️ Impossible de lire la traduction.";
    document.getElementById("stopButton").style.display = "none";
  };

  window.speechSynthesis.speak(utterance);
}

// Arrêter la lecture
window.stopAudio = function() {
  window.speechSynthesis.cancel();
  document.getElementById("stopButton").style.display = "none";
  document.getElementById("message").textContent =
    "⏹ Lecture arrêtée.";
};

// Traduction principale
window.translateText = async function() {
  const textArea = document.getElementById("source");
  const file = document.getElementById("file").files[0];
  const language = document.getElementById("language").value;
  const mode = document.getElementById("mode").value;

  const output = document.getElementById("output");
  const message = document.getElementById("message");
  const button = document.getElementById("translateButton");

  let text = textArea.value.trim();

  if (!text && !file) {
    message.textContent =
      "Veuillez ajouter un texte ou un fichier audio.";
    return;
  }

  if (file && !text && !file.type.startsWith("audio/")) {
    message.textContent =
      "Veuillez choisir un fichier audio.";
    return;
  }

  button.disabled = true;
  window.speechSynthesis?.cancel();

  try {
    // Transcription audio
    if (file && !text) {
      text = await transcribeInChunks(file, message);

      if (!text.trim()) {
        throw new Error("Aucune parole détectée dans ce fichier.");
      }

      textArea.value = text;
      message.textContent =
        "✅ Paroles extraites. Traduction en cours...";
    }

    // Traduction du texte
    button.textContent = "🌍 Traduction en cours...";

    const response = await fetch("/api/translate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: text,
        target: language
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "La traduction a échoué.");
    }

    output.textContent = data.translatedText;

    // Audio vers audio
    if (mode === "audio") {
      speakTranslation(
        data.translatedText,
        language,
        message
      );
    } else {
      message.textContent = "✅ Traduction terminée !";
    }

  } catch (error) {
    output.textContent =
      "La traduction n'a pas pu être effectuée.";

    message.textContent = "⚠️ " + error.message;

  } finally {
    button.disabled = false;
    button.textContent = "🌍 Traduire maintenant";
  }
};
</script>
